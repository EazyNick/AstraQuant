# config.yaml

general:
  seed: 362165 # 랜덤 시드 값
  device: "cuda" # 학습 장치 (cuda / cpu)

env:
  initial_balance: 10000000 # 초기 잔액
  observation_window: 5 # 한 번에 입력하는 시계열 길이
  transaction_fee: 0.001 # 거래 수수료 (0.1% = 0.001)
  # max_shares_per_trade: 10 # 분할 매수, 매도 상한 (실제 ACTION은 *30 만큼 해서 진행, ACTION SPACE 설정임) - 3개 액션 방식으로 변경됨
  shares_scaling_factor: 1000000 # 주식 보유량 학습용 스케일링 팩터 (0.XXX 형태로 변환)

training:
  episodes: 10000 # 학습 에피소드 수
  batch_size: 16 # 배치 크기
  epsilon: 1.0 # 시작 입실론 (1.0으로 변경)
  epsilon_min: 0.1 # 최소 입실론 (0.1로 증가)
  epsilon_decay: 0.9995 # 매 스텝마다 곱해질 감쇠율 (더 천천히 감소)
  learning_rate: 0.0001 # 학습률
  gamma: 0.999 # 할인율 (future reward 반영 비율)
  clampepsilon: 0.2 # PPO 클리핑 파라미터
  entropy_coef: 0.1 # 엔트로피 보상 계수 (정책 다양성 장려, 높을수록 더 평평한 분포)
  temperature: 1.2 # 정책 분포 온도 (높을수록 더 평평한 분포, 낮을수록 날카로운 분포)
  num_workers: NULL # 병렬 환경 개수 (멀티 프로세싱 사용 시)

model:
  input_dim: 10 # 입력 피처 개수 (자동 설정 가능)
  model_dim: 32 # Transformer 모델 차원
  num_heads: 4 # Transformer Multi-Head Attention 개수
  num_layers: 2 # Transformer 레이어 개수
